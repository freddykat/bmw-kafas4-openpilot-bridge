    dependencies: TO_VALIDATE

  front_side_radar_left:
    quantity: 1
    part_number: null
    network: TO_VALIDATE

  front_side_radar_right:
    quantity: 1
    part_number: null
    network: TO_VALIDATE

  rear_side_radar_left:
    quantity: 1
    part_number: null
    network: TO_VALIDATE

  rear_side_radar_right:
    quantity: 1
    part_number: null
    network: TO_VALIDATE

bench_reference_ecus:
  sas:
    required_in_vehicle: false
    allowed_on_bench: true
    role: teacher_reference
  bdc:
    required_in_vehicle: false
    allowed_on_bench: true
    role: startup_network_reference_if_needed

interfaces_to_source:
  automotive_ethernet_100base_t1: TO_VALIDATE
  can_fd: TO_VALIDATE
  classic_can: TO_VALIDATE
  flexray_rx: CONDITIONAL
  protected_power_breakout: REQUIRED

purchase_rule: >-
  Do not buy a mixed five-radar/KAFAS set until exact generation compatibility,
  topology and required ECU partners have been checked against one donor configuration.
