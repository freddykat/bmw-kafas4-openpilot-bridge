      flexray: TO_VALIDATE
    dependencies:
      sas: TO_VALIDATE
      bdc: TO_VALIDATE
      fsc: TO_VALIDATE
      coding_cafd: TO_VALIDATE
      calibration: REQUIRED_TO_VALIDATE

  front_long_range_radar:
    quantity: 1
    part_number: null
